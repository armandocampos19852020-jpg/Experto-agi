version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - DATABASE_URL=postgresql://experto:experto@postgres:5432/experto_agi
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - WANDB_API_KEY=${WANDB_API_KEY}
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
    command: uvicorn nim_c2_agent_api:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=experto_agi
      - POSTGRES_USER=experto
      - POSTGRES_PASSWORD=experto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
